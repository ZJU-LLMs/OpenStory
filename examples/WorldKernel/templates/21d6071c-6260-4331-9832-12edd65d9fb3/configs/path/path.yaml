name: Path
entity_type: path

dimensions:

  # ── 路径档案 ──────────────────────────────────────────────
  profile:
    identity:
      type: IdentityDim
      path: dims/identity.yaml

  # ── 端点连接 ──────────────────────────────────────────────
  endpoints:
    endpoints:
      type: EndpointsDim
      path: dims/endpoints.yaml

  # ── 路径属性 ──────────────────────────────────────────────
  properties:
    properties:
      type: PropertiesDim
      path: dims/properties.yaml

  # ── 通行条件 ──────────────────────────────────────────────
  conditions:
    conditions:
      type: ConditionsDim
      path: dims/conditions.yaml
