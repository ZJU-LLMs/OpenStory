# ============================================================
#  Location 全局配置模版
#  定义 Location 实体的维度组成
# ============================================================

name: Location
entity_type: location

dimensions:

  # ── 地点档案 ──────────────────────────────────────────────
  profile:
    identity:
      type: IdentityDim
      path: dims/identity.yaml

  # ── 访问控制 ──────────────────────────────────────────────
  access:
    access:
      type: AccessDim
      path: dims/access.yaml

  # ── 运行时状态 ──────────────────────────────────────────────
  state:
    state:
      type: StateDim
      path: dims/state.yaml

  # Visual prompt used directly by downstream image generation
  visual:
    visual:
      type: str
      path: dims/visual.yaml
