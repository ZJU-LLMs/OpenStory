# WorldKernel generation constraints
# 0 = unlimited

generation_constraints:
  max_locations: 15
  max_characters: 15

# Spatial generation config
spatial_generation:
  enabled: true
  output_subdir: "stage2/spatial"

  canvas:
    grid_width: 128
    grid_height: 72
    tile_size: 16
    margin_tiles: 6
    default_region_min_size: [12, 8]
    default_region_max_size: [22, 16]
    corridor_width: 3

  grid_values:
    blocked: 0
    walkable: 1

  layout:
    algorithm: "fr_constraint_rect_packing"
    random_seed: 42
    fr_iterations: 200
    packing_max_attempts: 2000
    default_layer_id: "ground"
    min_region_gap: 6
    preferred_region_gap: 10
    edge_comfort_margin: 5
    candidate_limit: 96

  routing:
    algorithm: "orthogonal_astar"
    allow_diagonal: false
    default_movement_cost: 1.0
    secret_path_cost_multiplier: 1.5

  rendering:
    export_tiled_json: true
    export_preview_png: true
    background_mode: "simple_tile"
    ai_art_enabled: true
    location_layer_enabled: true
    character_atlas_enabled: true
    characters_per_atlas: 3
    character_key_colors: ["#00ff00", "#00ffff"]
    character_transparent_threshold: 24
    character_opaque_threshold: 96
    visual_mode: "composited_full_map"

  validation:
    require_all_locations_reachable: true
    require_path_edges_routable: true
    max_region_overlap_ratio: 0.0
    min_entrances_per_location: 1
