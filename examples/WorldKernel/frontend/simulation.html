<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>OpenStory WorldKernel Simulation</title>
  <link rel="stylesheet" href="simulation-modern.css?v=20260812-task-label1" />
  <link rel="stylesheet" href="book-ui.css?v=20260812-task-label1" />
</head>
<body class="sim-page">
  <main class="shell" aria-label="OpenStory WorldKernel 模拟界面">
    <header class="app-header">
      <div class="brand-panel">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy">
          <h1>OpenStory</h1>
          <div class="muted" id="sessionLabel">一句生成世界，自主模拟角色命运与故事发展</div>
        </div>
      </div>

      <nav class="book-nav" aria-label="世界导航">
        <button id="worldViewBtn" class="nav-item active" type="button">
          <span class="nav-icon nav-world" aria-hidden="true"></span>
          <span>世界地图</span>
        </button>
        <button id="worldSettingsBtn" class="nav-item" type="button">
          <span class="nav-icon nav-book" aria-hidden="true"></span>
          <span>世界设定</span>
        </button>
        <button id="charactersBtn" class="nav-item" type="button">
          <span class="nav-icon nav-character" aria-hidden="true"></span>
          <span>角色总览</span>
        </button>
        <div class="nav-tick-status" aria-label="当前 Tick 轮数">
          <span class="nav-icon nav-tick" aria-hidden="true"></span>
          <span class="nav-tick-copy"><small>Tick</small><strong id="tickValue">0</strong></span>
        </div>
      </nav>

      <div class="world-name-plaque" aria-label="当前世界">
        <span>当前世界</span>
        <strong id="worldName">正在载入...</strong>
      </div>
    </header>

    <div class="error" id="errorBox"></div>

    <section class="book-spread">
      <section class="world-panel" aria-label="世界地图">
        <div class="map-stage">
          <div class="map-wrap">
            <div class="map-surface" id="mapSurface">
              <canvas id="mapCanvas" aria-label="可交互世界地图"></canvas>
              <div class="map-agent-layer" id="mapAgentLayer"></div>
            </div>
          </div>
        </div>

      </section>

    </section>

    <div class="controls" aria-label="模拟控制">
      <button id="tickBtn" class="bookmark-control tick" type="button"><span class="bookmark-symbol" aria-hidden="true">››</span><span class="control-label">推进 Tick</span></button>
      <button id="autoBtn" class="bookmark-control auto" type="button"><span class="bookmark-symbol" aria-hidden="true">▶</span><span class="control-label">自动播放</span></button>
      <button id="stopBtn" class="bookmark-control stop" type="button"><span class="bookmark-symbol" aria-hidden="true">■</span><span class="control-label">停止模拟</span></button>
    </div>

    <div id="agentList" hidden></div>
  </main>

  <div class="modal-overlay" id="detailOverlay" aria-hidden="true">
    <article class="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head">
        <div>
          <div class="detail-kicker" id="detailKicker">Detail</div>
          <h2 class="detail-title" id="detailTitle">详情</h2>
          <div class="detail-subtitle" id="detailSubtitle"></div>
        </div>
        <button class="icon-button" id="detailClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </article>
  </div>

  <script src="simulation-modern.js?v=20260812-task-label1"></script>
</body>
</html>
